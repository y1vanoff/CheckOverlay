<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CheckOverlay</title><link rel="stylesheet" href="style.css"></head><body><main id="app" aria-label="ЧекОверлей"><header id="header"><span id="drag" data-tauri-drag-region><img src="assets/mini.svg" alt="">ЧекОверлей</span><button id="collapse" aria-label="Свернуть в иконку" title="Свернуть в иконку">↙</button><button id="hide" aria-label="Скрыть в трей" title="Скрыть в трей">×</button></header><section id="full"><div class="heading"><div><h1>Мои задачи</h1><p id="count"></p></div><button id="settingsButton" aria-label="Настройки">⚙</button></div><div id="message" role="alert" hidden></div><div id="tasks"></div><button id="add" class="wide">+ Добавить задачу</button><footer><span id="saveStatus" role="status"></span><button id="retry" hidden>Повторить</button></footer></section><section id="settings" hidden><div class="heading"><button id="back">← Назад</button><h1>Настройки</h1></div><label><input id="topmost" type="checkbox"> Поверх остальных окон</label><label><input id="autostart" type="checkbox"> Запускать вместе с Windows</label><label><input id="showDone" type="checkbox"> Показывать выполненные</label><label><input id="confirmDelete" type="checkbox"> Подтверждать удаление</label><label>Цвет фона <input id="color" type="color"></label><label>Прозрачность фона <output id="opacityLabel"></output><input id="transparency" type="range" min="0" max="70" step="5"></label><img id="previewIcon" alt="Компактная иконка"><button id="chooseImage">Выбрать PNG, JPG или GIF…</button><button id="resetImage">Вернуть логотип утёнка</button><p class="note">Выполненные удаляются в 09:00 и после новой загрузки Windows.</p><button id="quit" class="wide">Выйти из приложения</button></section><button id="compact" aria-label="Открыть чеклист" hidden><img id="compactImage" src="assets/duck.svg" alt="ЧекОверлей"></button><dialog id="deleteDialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">Подтвердите удаление</h2><p>Удалить выбранную задачу?</p><div class="actions"><button id="yes" class="danger">Да</button><button id="no" autofocus>Нет</button></div><label><input id="dontAsk" type="checkbox"> Больше не спрашивать</label></dialog><dialog id="exitDialog"><h2>Изменения не сохранены</h2><p>Повторите сохранение или вернитесь к списку.</p><button id="exitRetry">Повторить</button><button id="exitCancel">Вернуться</button><button id="exitAnyway" class="danger">Выйти без сохранения</button></dialog><dialog id="recovery"><h2>Не удалось прочитать данные</h2><p id="recoveryError"></p><button id="recover">Выбрать корректный файл…</button><button id="startEmpty">Начать пустой список…</button></dialog></main><script type="module" src="app.js"></script></body></html>
